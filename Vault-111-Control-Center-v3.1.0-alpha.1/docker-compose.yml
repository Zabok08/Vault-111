services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vault111
      POSTGRES_PASSWORD: vault111_dev_only
      POSTGRES_DB: vault111
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vault111_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault111"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vault111_pgdata:
