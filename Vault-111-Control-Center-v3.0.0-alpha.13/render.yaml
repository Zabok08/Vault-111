services:
  - type: web
    name: vault111-control-center
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.torn.com
      - key: VAULT111_FACTION_ID
        sync: false
      - key: JWT_ISSUER
        value: vault111-control-center
      - key: JWT_AUDIENCE
        value: vault111-userscript
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: KEY_ENCRYPTION_ACTIVE_VERSION
        value: v1
      - key: KEY_ENCRYPTION_KEYS_JSON
        sync: false
      - key: TORN_API_BASE_URL
        value: https://api.torn.com/v2
      - key: TRUST_PROXY
        value: "true"
